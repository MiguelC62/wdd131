<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <title>Form | BYU-Idaho WDD 131 project</title>
    <meta name="author" content="Miguel Condori" >
    <meta
      name="description"
      content="Product review form for WDD 131 project. It includes a submission confirmation with a counter."
    >
    <link rel="stylesheet" href="styles/form.css" />
    <link rel="icon" href="data:," />
    <script src="scripts/footer.js" defer></script>
    <script src="scripts/form.js" defer></script>
  </head>
  <body>
    <header>
      <h1>Product Review</h1>
    </header>
    <main>
      <form method="get" action="review.html">
        <label for="productName">Product Name</label>
        <select id="productName" name="productName" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
        <noscript
          ><p>Please enable JavaScript to load the product list.</p></noscript
        >

        <fieldset>
          <legend>Overall Rating</legend>
          <div class="rating-options">
            <label for="star1"><input type="radio" id="star1" name="rating" value="1" required /> 1 Star</label>
            <label for="star2"><input type="radio" id="star2" name="rating" value="2" required /> 2 Stars</label>
            <label for="star3"><input type="radio" id="star3" name="rating" value="3" required /> 3 Stars</label>
            <label for="star4"><input type="radio" id="star4" name="rating" value="4" required /> 4 Stars</label>
            <label for="star5"><input type="radio" id="star5" name="rating" value="5" required /> 5 Stars</label>
          </div>
        </fieldset>

        <label for="installDate">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required />

        <fieldset>
          <legend>Useful Features</legend>
          <label
            ><input type="checkbox" name="features" value="Durability" />
            Durability</label
          >
          <label
            ><input type="checkbox" name="features" value="Ease of Use" /> Ease
            of Use</label
          >
          <label
            ><input type="checkbox" name="features" value="Performance" />
            Performance</label
          >
          <label
            ><input type="checkbox" name="features" value="Design" />
            Design</label
          >
        </fieldset>

        <label for="writtenReview">Written Review (optional)</label>
        <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

        <label for="userName">Your Name (optional)</label>
        <input type="text" id="userName" name="userName" autocomplete="name" />

        <input type="submit" value="Post Review" />
      </form>
    </main>
    <footer>
      <p>&copy; <span id="currentyear"></span> Miguel Condori, Utah, USA</p>
      <p id="lastModified"></p>
    </footer>
  </body>
</html>
